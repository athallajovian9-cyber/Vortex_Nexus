[package]
name = "vortex-nexus"
version = "0.2.0"
description = "Vortex Nexus — Tauri shell for chat (nexus protocol) + LiveKit A/V"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonwebtoken = "9"

[profile.release]
strip = true
lto = true
codegen-units = 1
